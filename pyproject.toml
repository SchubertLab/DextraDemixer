[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dextrademixer"
version = "0.0.1"
description = "Probabilistic identification of antigen-specific T cells from single-cell pMHC multimer data"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
  { name = "Yang an", email = "yang.an@helmholtz-muenchen.de" },
  { name = "Benjamin Schubert", email = "benjamin.schubert@helmholtz-muenchen.de" }
]
maintainers = [
  {name = "Yang an", email = "yang.an@helmholtz-muenchen.de" },
  { name = "Benjamin Schubert", email = "benjamin.schubert@helmholtz-muenchen.de" },
]
keywords = [
  "antigen specificity",
  "pMHC multimer",
  "single-cell",
  "T cell",
]
classifiers = [
    "Development Status :: 3 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "anndata>=0.12.0",
    "arviz>=0.22.0,<1.0",
    "jax>=0.5.1",
    "matplotlib>=3.10.7",
    "mudata>=0.3.2",
    "muon>=0.1.7",
    "numpy>=1.26.0",
    "numpyro>=0.16.0",
    "optax>=0.1.7",
    "pandas>=2.3.3",
    "pytest",
    "scanpy>=1.10.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.12.0",
    "scirpy>=0.13.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.1",
    "tqdm>=4.68.3",
]

[project.urls]
Homepage = "https://github.com/SchubertLab/DextraDemixer"
Issues = "https://github.com/SchubertLab/DextraDemixer/issues"
Publication = "https://doi.org/10.64898/2026.06.23.733339"
Repository = "https://github.com/SchubertLab/DextraDemixer.git"

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = ["slow: end-to-end SVI fits (minutes); deselect with -m 'not slow'"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["dextrademixer*"]
exclude = ["dextrademixer.test", "dextrademixer.test.*"]

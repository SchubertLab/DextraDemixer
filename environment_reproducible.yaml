# Reproducible development and analysis environment for DextraDemixer.
# Runtime dependency versions are kept in sync with pyproject.toml.

name: dextrademixer
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13
  - pip
  - snakemake
  - jupyterlab
  - pip:
      - anndata==0.13.2
      - arviz==0.22.0
      - jax==0.8.1
      - jaxlib==0.8.1
      - matplotlib==3.10.7
      - mudata==0.3.2
      - muon==0.1.7
      - numpy==2.3.5
      - numpyro==0.19.0
      - openpyxl>=3.1.5
      - optax==0.2.6
      - pandas==2.3.3
      - psutil==7.1.3
      - scanpy==1.11.5
      - scikit-learn==1.7.2
      - scipy==1.16.3
      - scirpy==0.22.3
      - seaborn==0.13.2
      - statsmodels==0.14.5
      - tcrdist3==0.3
      - tqdm==4.70.0

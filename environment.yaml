# Development and analysis environment for DextraDemixer.
# Dependency constraints are the ones declared in pyproject.toml; see
# environment_reproducible.yaml for the pinned versions the results were produced with.

name: dextrademixer
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11
  - pip
  - jupyterlab
  - pip:
      - anndata>=0.12.0
      - arviz>=0.22.0,<1.0
      - jax>=0.5.1
      - matplotlib>=3.10.7
      - mudata>=0.3.2
      - muon>=0.1.7
      - numpy>=1.26.0
      - numpyro>=0.16.0
      - optax>=0.1.7
      - pandas>=2.3.3
      - pytest
      - scanpy>=1.10.0
      - scikit-learn>=1.7.2
      - scipy>=1.12.0
      - scirpy>=0.13.0
      - seaborn>=0.13.2
      - statsmodels>=0.14.1
      - tqdm>=4.68.3
